DIAL_SPEAKER1_0=Loony Bin Central. Professor Wacko here
DIAL_SPEAKER1_1=Loony Bin Central. Alexa, your virtual assistant, speaking. What seems to be the trouble?
DIAL_ANSWER1_0=That psycho is coding another engine!!
DIAL_ANSWER1_1=The Engine-Psycho is losing it again!
DIAL_SPEAKER2_0="<font color=\"#aaa\"><i>SCREAMS ON THE OTHER END</i></font> <br>We need a brigade, urgently! Engine-Writing is having an exacerbation!<br>Procrastinators Highway, house 404, I WILL GO <font color=\"#f00\" fx=\"shake\"><b>PERSONALLY!!</b></font><br><font color=\"#aaa\"><i>*** DIAL TONE***</i></font>"
DIAL_SPEAKER2_1="Say no more!<br>We are deploying the latest <font fx=\"cosmos\">SEX-BOT</font> <img src=\"UI/nurseicon\" inline=\"1\" width=\"88\" valign=\"top\" margin=\"0 6\"> model with a built-in nurse module.<br>Healing nanites will fix the psycho in a matter of minutes!"
DIAL_ANSWER2_0=Finally, the code-monkey is going into quarantine.
DIAL_ANSWER2_1="Ok "
DRIVE_SPEAKER1="<font color=\"#aaa\" fx=\"glitch\"><b>***CHRK***</b></font><br>This is Wacko!<br>We can't reach the engine dev, I have absolutely no idea how he even got up there!"
DRIVE_SPEAKER2="<font color=\"#aaa\" fx=\"glitch\"><b>***CHRK***</b></font><br>Requesting air support!<br><font color=\"#aaa\" fx=\"glitch\"><b>***CHRK***</b></font><br>Do you copy? Over.<br><font color=\"#aaa\" fx=\"glitch\"><b>***CHRK***</b></font>"
DRIVE_ANSWER_SUPPORT="Roger that. We are sending <font fx=\"fire\">Smokey</font>."
LAST_INTRO="The Inquisitor definitely entered here. I need to figure out what he's planning. It's so dark here. "
SANCTUARY_START="The goddess suspects me and will soon track me down. I must warn Alianna; our unborn child must not be harmed. "
BOOK_FOUND="This is a tome of portal magic. It will come in handy! "
HEADS_PORTAL_CANT="A portal of Darkness. Only gods can pass through Darkness. "
YESNO_EVENT="This will trigger a chain of fateful events. Maybe we should look around first? "
FIN_LINE1="Inquisitor? What are you doing here? This place is consumed by Corruption. "
FIN_LINE2="Amarantha, I simply saw the Cube of flesh. It suddenly opened, and here I am. "
FIN_LINE3="Has the Darkness so clouded your mind that you imagine you can deceive the gods themselves? "
FIN_LINE4="I will ask you one last time. You'd better tell the truth! "
FIN_LINE5="Goddess, I beg you, spare... "
FIN_LINE6="Inquisitor.. Have you brought guests? "
FIN_LINE7="Alianna, run, save yourself from the goddess's wrath! I'll hold her... "
FIN_LINE8="Heresy! "
FIN_LINE9="Silly, you still haven't understood.. There are two goddesses here.\nAnd you... Burn out, sunshine! "
FIN_LINE10="What is happening!? My strength is leaving me. "
FIN_LINE11="Kill her! There is no better food for our child than a goddess's soul! "
FIN_LINE12="But can a god be killed? "
FIN_LINE13="Of course! For that, you need the right place. We are in the right place. I've weakened her; tear her head off! "
FIN_LINE14="Look at her! She is darkness itself. What we fought against all this time! Return to the light! Kill her! "
FIN_FINAL_QUESTION="But can a god be killed? "
